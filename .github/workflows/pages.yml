name: pages
on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"
  push:
    branches: [main]

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.material.outputs.should_deploy }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile runtime
        run: python -m compileall src

      - name: Run tests
        run: PYTHONPATH=src python -m unittest discover -s tests -v

      - name: Validate shared AI memory
        run: PYTHONPATH=src python -m kmb_lab.memory --strict

      - name: Decide whether this run needs a Pages deploy
        id: material
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -eu
          SHOULD_DEPLOY=false

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            SHOULD_DEPLOY=true
          else
            if [ "$(PYTHONPATH=src python -m kmb_lab.pages should-deploy --source-commit "$GITHUB_SHA" | tail -n 1)" = "true" ]; then
              SHOULD_DEPLOY=true
            fi
          fi

          if [ "$EVENT_NAME" = "push" ] && [ "$SHOULD_DEPLOY" != "true" ]; then
            if [ -n "${BEFORE_SHA:-}" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
              CHANGED="$(git diff --name-only "$BEFORE_SHA" "$GITHUB_SHA")"
            else
              CHANGED="$(git show --pretty="" --name-only "$GITHUB_SHA")"
            fi
            printf '%s\n' "$CHANGED"
            if printf '%s\n' "$CHANGED" | grep -Eq '^(web/|src/kmb_lab/pages\.py$|tests/test_pages\.py$|\.github/workflows/pages\.yml$)'; then
              SHOULD_DEPLOY=true
            fi
          fi

          echo "should_deploy=$SHOULD_DEPLOY" >> "$GITHUB_OUTPUT"
          echo "Pages deploy required: $SHOULD_DEPLOY"

      - name: Generate web output
        if: steps.material.outputs.should_deploy == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          PYTHONPATH=src python -m kmb_lab.pages generate --output-dir web --source-commit "$GITHUB_SHA" --repository "$GITHUB_REPOSITORY"
          test -s web/index.html
          test -s web/status.json
          grep -F "$GITHUB_SHA" web/index.html
          python - <<'PY'
          import json
          status=json.load(open("web/status.json", encoding="utf-8"))
          assert status["source_commit"]
          assert status["generated_at"]
          assert status["material_fingerprint"]
          print(status["source_commit"], status["generated_at"], status["material_fingerprint"])
          PY

      - uses: actions/configure-pages@v5
        if: steps.material.outputs.should_deploy == 'true'

      - uses: actions/upload-pages-artifact@v3
        if: steps.material.outputs.should_deploy == 'true'
        with:
          path: web

  deploy:
    if: needs.build.outputs.should_deploy == 'true'
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify public Pages source, timestamp, fingerprint and core sections
        run: |
          PYTHONPATH=src python -m kmb_lab.pages verify-live --url "${{ steps.deployment.outputs.page_url }}" --source-commit "$GITHUB_SHA" --attempts 12 --sleep-seconds 5
