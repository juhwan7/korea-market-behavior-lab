name: market-fast-lane

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"
  push:
    branches: [main]
    paths:
      - "src/kmb_lab/**"
      - "tests/**"
      - "data/config/**"
      - ".github/workflows/market-fast-lane.yml"

permissions:
  contents: write

concurrency:
  group: market-fast-lane
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile runtime
        run: python -m compileall src

      - name: Run all tests
        run: PYTHONPATH=src python -m unittest discover -s tests -v

      - name: Collect and analyze market intelligence
        env:
          KRX_AUTH_KEY: ${{ secrets.KRX_AUTH_KEY }}
        run: PYTHONPATH=src python -m kmb_lab.pipeline

      - name: Validate generated canonical data
        run: |
          python - <<'PY'
          import json, pathlib
          required = [
              "data/market/current.json",
              "data/market/summary.json",
              "data/market/flows.json",
              "data/market/breadth.json",
              "data/market/futures.json",
              "data/market/global.json",
              "data/market/strength.json",
              "data/news/current.json",
              "data/news/issues.json",
              "data/news/issue-digest.json",
              "data/stocks/smart-money.json",
              "data/system/collector-status.json",
              "data/ai/development-mix.json",
              "data/ai/unresolved-problems.jsonl",
          ]
          for name in required:
              path = pathlib.Path(name)
              if not path.exists():
                  raise SystemExit(f"missing required output: {name}")
              if path.suffix == ".json":
                  json.loads(path.read_text(encoding="utf-8"))
              elif path.suffix == ".jsonl":
                  for line in path.read_text(encoding="utf-8").splitlines():
                      if line.strip():
                          json.loads(line)
              print("ok", name)
          PY

      - name: Persist material outputs
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A \
            data/market \
            data/news \
            data/stocks \
            data/system/collector-status.json \
            data/ai/development-mix.json \
            data/ai/unresolved-problems.jsonl
          if git diff --cached --quiet; then
            echo "No material market change."
            exit 0
          fi
          git commit -m "product: refresh market intelligence"

          # Tests or adapters may leave non-canonical runtime leftovers. All intended
          # market/news outputs are committed above; isolate anything else so it
          # cannot block the rebase/push persistence step.
          if [ -n "$(git status --porcelain)" ]; then
            echo "Isolating non-canonical dirty worktree before rebase:"
            git status --short
            git stash push --include-untracked -m "market-fast-lane-runtime-leftovers"
          fi

          git pull --rebase origin main
          git push origin HEAD:main
