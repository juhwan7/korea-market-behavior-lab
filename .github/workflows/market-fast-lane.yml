name: market-fast-lane

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"
  push:
    branches: [main]
    paths:
      - "src/kmb_lab/**"
      - "tests/**"
      - "data/config/**"
      - ".github/workflows/market-fast-lane.yml"

permissions:
  contents: write
  actions: write

concurrency:
  group: market-fast-lane
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile runtime
        run: python -m compileall src

      - name: Run all tests
        run: PYTHONPATH=src python -m unittest discover -s tests -v

      - name: Collect and analyze market intelligence
        env:
          KRX_AUTH_KEY: ${{ secrets.KRX_AUTH_KEY }}
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
        run: PYTHONPATH=src python -m kmb_lab.pipeline

      - name: Validate generated canonical data
        run: |
          python - <<'PY'
          import json, pathlib
          required = [
              "data/market/current.json",
              "data/market/summary.json",
              "data/market/flows.json",
              "data/market/breadth.json",
              "data/market/futures.json",
              "data/market/global.json",
              "data/market/bok-official.json",
              "data/market/turnover.json",
              "data/market/sector-breadth.json",
              "data/market/strength.json",
              "data/news/current.json",
              "data/news/disclosures.json",
              "data/news/issues.json",
              "data/news/issue-digest.json",
              "data/stocks/smart-money.json",
              "data/stocks/smart-money-backtest.json",
              "data/stocks/relative-strength.json",
              "data/system/collector-status.json",
              "data/system/services.json",
              "data/ai/development-mix.json",
              "data/ai/unresolved-problems.jsonl",
              "data/experiments/registry.json",
          ]
          for name in required:
              path = pathlib.Path(name)
              if not path.exists():
                  raise SystemExit(f"missing required output: {name}")
              if path.suffix == ".json":
                  json.loads(path.read_text(encoding="utf-8"))
              elif path.suffix == ".jsonl":
                  for line in path.read_text(encoding="utf-8").splitlines():
                      if line.strip():
                          json.loads(line)
              print("ok", name)
          PY

      - name: Persist material outputs
        env:
          KRX_AUTH_KEY: ${{ secrets.KRX_AUTH_KEY }}
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          MATERIAL_PATHS="data/market data/news data/stocks data/system/collector-status.json data/system/services.json data/ai/development-mix.json data/ai/unresolved-problems.jsonl data/experiments/registry.json"

          # Generated snapshots are not mergeable source code. Rebase of two independently
          # generated snapshots creates conflicts and can stall the 10-minute lane.
          # For each bounded attempt, move to the latest main, regenerate there, and commit
          # one coherent snapshot. If collector code itself advanced, a newer workflow run
          # owns persistence and this older run exits without overwriting it.
          for ATTEMPT in 1 2 3; do
            echo "Persistence attempt $ATTEMPT/3"
            git fetch origin main

            CODE_CHANGES="$(git diff --name-only "$GITHUB_SHA" origin/main -- src/kmb_lab tests .github/workflows/market-fast-lane.yml data/config || true)"
            if [ -n "$CODE_CHANGES" ] && [ "$ATTEMPT" = "1" ]; then
              echo "Collector code/config advanced after this run started; newer run owns persistence:"
              printf '%s\n' "$CODE_CHANGES"
              exit 0
            fi

            git reset --hard origin/main
            git clean -fd
            PYTHONPATH=src python -m kmb_lab.pipeline

            git add -A $MATERIAL_PATHS
            if git diff --cached --quiet; then
              echo "No material market change."
              exit 0
            fi

            git commit -m "product: refresh market intelligence"
            if git push origin HEAD:main; then
              echo "Market intelligence persisted successfully."
              echo "Dispatching Pages immediately because GITHUB_TOKEN pushes do not trigger downstream push workflows."
              curl --fail-with-body -L \
                -X POST \
                -H "Accept: application/vnd.github+json" \
                -H "Authorization: Bearer $GITHUB_TOKEN" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/pages.yml/dispatches" \
                -d '{"ref":"main"}'
              exit 0
            fi

            echo "Push raced with another main update; regenerating on latest main."
          done

          echo "Failed to persist market intelligence after 3 bounded attempts."
          exit 1
