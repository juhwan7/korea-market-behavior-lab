name: system-check
on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"
  push:
    branches: [main]
    paths-ignore:
      - "data/system/health-snapshot.json"
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile runtime
        run: python -m compileall src
      - name: Run unit tests
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Generate health snapshot
        run: PYTHONPATH=src python -m kmb_lab.supervisor --strict
      - name: Validate JSON
        run: |
          python - <<'PY'
          import json, pathlib
          for p in pathlib.Path("data").rglob("*.json"):
              json.loads(p.read_text(encoding="utf-8"))
              print("ok", p)
          PY
      - name: Upload health snapshot
        uses: actions/upload-artifact@v4
        with:
          name: system-health
          path: data/system/health-snapshot.json
          retention-days: 7
